name: Keep Database Active

on:
  schedule:
    - cron: '0 0 */3 * *'  # Every 3 days at midnight UTC
  workflow_dispatch:        # Allow manual trigger from the GitHub Actions UI

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST health endpoint
        run: |
          echo "Pinging Supabase REST endpoint..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase REST status: $RESPONSE"
          if [ "$RESPONSE" -ne 200 ]; then
            echo "Warning: Supabase REST endpoint returned status $RESPONSE"
          else
            echo "Supabase is alive."
          fi

      - name: Ping app /api/health route
        run: |
          HEALTH_URL="${{ secrets.APP_URL }}/api/health"
          echo "Pinging app health endpoint at: $HEALTH_URL"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$HEALTH_URL")
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          echo "Status: $STATUS"
          echo "Body: $BODY"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: App health endpoint returned status $STATUS"
          else
            echo "App is alive and database is active."
          fi
